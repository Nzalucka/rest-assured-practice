name: REST Assured Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        run: |
          mvn test -Dtest=GetUsersTest
          sleep 60
          mvn test -Dtest=GetUsersListTest
          sleep 60
          mvn test -Dtest=CreateUserTest
          sleep 60
          mvn test -Dtest=UpdateUserTest
          sleep 60
          mvn test -Dtest=DeleteUserTest
          sleep 60
          mvn test -Dtest=PatchUserTest
          sleep 60
          mvn test -Dtest=NegativeTests