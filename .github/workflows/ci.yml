name: REST Assured Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        run: mvn test -Dtest=GetUsersTest,GetUsersListTest,CreateUserTest,UpdateUserTest,PatchUserTest,DeleteUserTest,NegativeTests
        env:
          API_KEY: ${{ secrets.API_KEY }}